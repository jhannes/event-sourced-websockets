openapi: 3.0.3
info:
  title: Incident management
  description: Web socket API to share information about incidents
  version: 1.0.0
paths:
  /ws/messages:
    get:
      responses:
        200:
          description: Returns messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFromServer"
components:
  schemas:
    MessageFromServer:
      oneOf:
        - $ref: "#/components/schemas/IncidentSummaryList"
        - $ref: "#/components/schemas/IncidentEvent"

    MessageToServer:
      oneOf:
        - $ref: "#/components/schemas/IncidentCommand"
      discriminator:
        propertyName: type

    IncidentEvent:
      allOf:
        - $ref: "#/components/schemas/IncidentCommand"
        - properties:
            username:
              type: string
          required: [username]

    IncidentSummaryList:
      properties:
        summaries:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummary"
      required: [summaries]

    IncidentSummary:
      properties:
        id:
          type: string
          format: uuid
        info:
          $ref: "#/components/schemas/IncidentInfo"
      required: [id, info]

    IncidentInfo:
      properties:
        description:
          type: string
        priority:
          type: string
          enum: [ALERT, HIGH, MEDIUM, LOW]

    IncidentCommand:
      properties:
        clientTime:
          type: string
          format: date-time
        incidentId:
          type: string
          format: uuid
        delta:
          $ref: "#/components/schemas/IncidentDelta"
      required: [clientTime, incidentId, delta]

    IncidentDelta:
      oneOf:
        - $ref: "#/components/schemas/CreateIncidentDelta"
        - $ref: "#/components/schemas/UpdateIncidentDelta"
      discriminator:
        propertyName: delta

    CreateIncidentDelta:
      properties:
        info:
          $ref: "#/components/schemas/IncidentInfo"
      required: [info]

    UpdateIncidentDelta:
      properties:
        info:
          $ref: "#/components/schemas/IncidentInfo"
      required: [info]

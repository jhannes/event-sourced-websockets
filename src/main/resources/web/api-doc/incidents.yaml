openapi: 3.0.3
info:
  title: Incident management
  version: 1.0.0
paths:
  /ws/incidents:
    get:
      responses:
        200:
          description: Web sockets incident event from server
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageFromServer"
components:
  schemas:
    IncidentInfo:
      properties:
        summary:
          type: string
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]

    MessageFromServer:
      oneOf:
        - $ref: "#/components/schemas/IncidentSummaryList"
        - $ref: "#/components/schemas/IncidentEvent"

    MessageToServer:
      oneOf:
        - $ref: "#/components/schemas/IncidentCommand"
        - $ref: "#/components/schemas/IncidentSubscribeRequest"
      discriminator:
        propertyName: type

    IncidentSnapshot:
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        info:
          $ref: "#/components/schemas/IncidentInfo"
      required: [id, info, createdAt, updatedAt]

    IncidentSummaryList:
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSnapshot"
      required: [incidents]

    IncidentCommand:
      properties:
        eventId:
          type: string
          format: uuid
        clientTime:
          type: string
          format: date-time
        incidentId:
          type: string
          format: uuid
        delta:
          $ref: "#/components/schemas/IncidentDelta"
      required: [eventId, clientTime, incidentId, delta]

    IncidentEvent:
      allOf:
        - $ref: "#/components/schemas/IncidentCommand"
        - properties:
            serverTime:
              type: string
              format: date-time

    IncidentDelta:
      oneOf:
        - $ref: "#/components/schemas/CreateIncident"
        - $ref: "#/components/schemas/UpdateIncident"
      discriminator:
        propertyName: type

    CreateIncident:
      properties:
        info:
          $ref: "#/components/schemas/IncidentInfo"
      required: [info]

    UpdateIncident:
      properties:
        info:
          $ref: "#/components/schemas/IncidentInfo"
      required: [info]

    IncidentSubscribeRequest:
      properties:
        incidentId:
          type: string
          format: uuid;
